name: minterm
description: "A Flutter+Dart Minitel emulator."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.1

dependencies:
  audioplayers: ^6.2.0
  charcode: ^1.3.1
  file_picker: ^10.1.9
  flutter:
    sdk: flutter
  path_provider: ^2.1.5
  # path: ^1.9.0
  provider: ^6.1.2
  share_plus: ^11.1.0
  web_socket_channel: ^3.0.1
  window_manager: ^0.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
