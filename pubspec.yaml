name: minterm
description: "A Flutter+Dart Minitel emulator."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.1

dependencies:
  charcode: ^1.3.1
  file_picker: ^8.1.2
  flutter:
    sdk: flutter
  provider: ^6.1.2
  window_manager: ^0.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
